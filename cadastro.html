<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Collector's Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="imagens/Logo.png" alt="logo Collector's Hub">
        </a>
    </div>

    <div class="header-actions">
        <a href="index.html" class="btn">🏠 Voltar à Loja</a>
    </div>
</header>

<main class="cadastro-wrapper">
    <div class="cadastro-card">
        <h2>Criar Conta</h2>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirma-senha">Confirmar Senha</label>
                <input type="password" id="confirma-senha" name="confirma-senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Cadastrar</button>
        </form>

        <div class="form-footer">
            <p>Já tem uma conta? <a href="#">Fazer Login</a></p>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 Collector's Hub | Todos os direitos reservados.</p>
</footer>

</body>
</html>
