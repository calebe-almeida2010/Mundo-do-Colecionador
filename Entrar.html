<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Collector's Hub</title>
    <link rel="stylesheet" href="entrar.css">
    <p class="botao_produto"><a class="letra_botao" href="index.html"><img class="logo" src="imagens/logo.png" alt="logo"></a></p>
</head>

<body>

<div class="container">

    <div class="cadastro-box">

        <h2>Entre na sua conta</h2>

        <form>

            <div class="campo">
                <label>E-mail ou Nome de Usuário</label>
                <input type="email" placeholder="Digite seu e-mail ou Nome de Usuário">
            </div>

            <div class="campo">
                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha">
            </div>

            <p><a href="index.html" class="botao"><button type="button">Entrar</button></a></p>

        </form>

        <p>Não possui uma conta?<a href="cadastro.html">Cadastrar</a></p>

    </div>

</div>

</body>
</html>
